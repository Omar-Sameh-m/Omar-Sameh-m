<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience — ICPC Zagazig, ITI internship, Zagazig University">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; }
    :root { --bone:#DDDDDD; --muted:#777777; --dim:#666666; --rule:#444444; --accent:#AAAAAA; --ghost:#2A2A2A; --node-bg:#1A1A1A; --core-bg:#222222; }
  </style>

  <line x1="120" y1="10" x2="120" y2="290" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42"  font-size="12" fill="var(--accent)" letter-spacing="2">2025—</text>
    <text class="mono" x="136" y="42"  font-size="15" fill="var(--bone)">ICPC Zagazig University Community · Vice Tech · Zagazig</text>
    <text class="mono" x="136" y="68"  font-size="14" fill="var(--muted)">technical team member since Jan 2025, Vice Tech since Sep 2025</text>
    <text class="mono" x="136" y="90"  font-size="14" fill="var(--muted)">supports training, technical operations for the community</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="150" font-size="12" fill="var(--accent)" letter-spacing="2">2025</text>
    <text class="mono" x="136" y="150" font-size="15" fill="var(--bone)">Information Technology Institute (ITI) · Flutter Intern · Jul–Aug</text>
    <text class="mono" x="136" y="176" font-size="14" fill="var(--muted)">built two Flutter apps using BLoC for state management and Firebase</text>
    <text class="mono" x="136" y="198" font-size="14" fill="var(--muted)">final project: full-featured Amazon-clone e-commerce app</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="258" font-size="12" fill="var(--accent)" letter-spacing="2">2023 –</text>
    <text class="mono" x="136" y="258" font-size="15" fill="var(--bone)">Zagazig University · B.Sc. Computer Software Engineering</text>
    <text class="mono" x="136" y="284" font-size="14" fill="var(--muted)">GDG On-Campus Zagazig — UI/UX track · IEEE CS Zagazig Student Chapter</text>
  </g>
</svg>

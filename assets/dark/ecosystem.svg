<svg viewBox="0 0 1000 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map: Controlak, Egypt Hackathon Scanner, Liquid Galaxy Controller, Forward Ai, all built by one person">
  <style>
    :root {
      --bone: #444444; --muted: #888888; --dim: #AAAAAA; --rule: #C0C0C0;
      --node-bg: #F0F0F0; --core-bg: #E8E8E8; --accent: #555555;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bone: #DDDDDD; --muted: #777777; --dim: #666666; --rule: #444444;
        --node-bg: #1A1A1A; --core-bg: #222222; --accent: #AAAAAA;
      }
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .node { fill: none; stroke: var(--rule); stroke-width: 1; }
    .nodeC { fill: none; stroke: var(--rule); stroke-width: 1; }
    .wire { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 500; stroke-dashoffset: 500; animation: draw 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .w1{animation-delay:.2s}.w2{animation-delay:.32s}.w3{animation-delay:.44s}.w4{animation-delay:.56s}
    .flow { stroke: var(--muted); stroke-width: 1; opacity: .2; stroke-dasharray: 3 9; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    .pop { opacity: 0; animation: pop .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pop { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .p0{animation-delay:.1s}.p1{animation-delay:.9s}.p2{animation-delay:1.0s}.p3{animation-delay:1.1s}.p4{animation-delay:1.2s}
    .core { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.55} }
    @media (prefers-reduced-motion: reduce) {
      .wire,.flow,.pop,.core { animation: none; }
      .wire{stroke-dashoffset:0} .pop{opacity:1} .flow{opacity:.1}
    }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; }
    :root { --bone:#DDDDDD; --muted:#777777; --dim:#666666; --rule:#444444; --accent:#AAAAAA; --node-bg:#1A1A1A; --core-bg:#222222; }
  </style>

  <defs>
    <mask id="node-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="480">
      <rect x="0" y="0" width="1000" height="480" fill="white"/>
      <rect x="405" y="212" width="190" height="56" fill="black"/>
      <rect x="90" y="90" width="200" height="54" fill="black"/>
      <rect x="710" y="90" width="200" height="54" fill="black"/>
      <rect x="90" y="336" width="200" height="54" fill="black"/>
      <rect x="710" y="336" width="200" height="54" fill="black"/>
    </mask>
  </defs>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">SYSTEM MAP — WHAT I'VE SHIPPED</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 01</text>

  <g mask="url(#node-cutouts)">
    <line class="wire w1" x1="440" y1="230" x2="190" y2="130"/>
    <line class="wire w2" x1="560" y1="230" x2="810" y2="130"/>
    <line class="wire w3" x1="440" y1="250" x2="190" y2="360"/>
    <line class="wire w4" x1="560" y1="250" x2="810" y2="360"/>
  </g>
  <g mask="url(#node-cutouts)">
    <line class="flow" x1="440" y1="230" x2="190" y2="130"/>
    <line class="flow" x1="560" y1="230" x2="810" y2="130"/>
    <line class="flow" x1="440" y1="250" x2="190" y2="360"/>
    <line class="flow" x1="560" y1="250" x2="810" y2="360"/>
  </g>

  <!-- core -->
  <g class="pop p0">
    <rect class="nodeC core" x="405" y="212" width="190" height="56" rx="2"/>
    <text fill="var(--bone)" class="mono" x="500" y="236" font-size="13" letter-spacing="2" text-anchor="middle">OMAR.SYS</text>
    <text fill="var(--muted)" class="mono" x="500" y="254" font-size="8.5" letter-spacing="0.5" text-anchor="middle">idea → build → ship → real users</text>
  </g>

  <!-- nodes -->
  <g class="pop p1"><rect class="node" x="90" y="90" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="190" y="113" font-size="12" letter-spacing="1" text-anchor="middle">Controlak</text><text fill="var(--muted)" class="mono" x="190" y="132" font-size="9" letter-spacing="1" text-anchor="middle">Flutter · tutor/student platform</text></g>

  <g class="pop p2"><rect class="node" x="710" y="90" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="810" y="113" font-size="12" letter-spacing="1" text-anchor="middle">Hackathon Scanner</text><text fill="var(--muted)" class="mono" x="810" y="132" font-size="9" letter-spacing="1" text-anchor="middle">Python · 60+ subscribers</text></g>

  <g class="pop p3"><rect class="node" x="90" y="336" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="190" y="359" font-size="12" letter-spacing="1" text-anchor="middle">LG Controller</text><text fill="var(--muted)" class="mono" x="190" y="378" font-size="9" letter-spacing="1" text-anchor="middle">Flutter · SSH · open source</text></g>

  <g class="pop p4"><rect class="node" x="710" y="336" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="810" y="359" font-size="12" letter-spacing="1" text-anchor="middle">Forward Ai</text><text fill="var(--muted)" class="mono" x="810" y="378" font-size="9" letter-spacing="1" text-anchor="middle">GDG Delta · 8th / 122 teams</text></g>

  <line x1="48" y1="440" x2="952" y2="440" stroke="var(--rule)"/>
  <text fill="var(--dim)" class="mono" x="952" y="462" font-size="10" letter-spacing="2" text-anchor="end">DASHED LINES — DATA IN MOTION</text>
</svg>

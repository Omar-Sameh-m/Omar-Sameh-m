<svg viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="At a glance: 650 plus problems solved, Codeforces Pupil, 60 plus scanner subscribers, 8th of 122 hackathon teams">
  <style>
    :root { --bone: #444444; --muted: #888888; --dim: #AAAAAA; --rule: #C0C0C0; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --muted: #777777; --dim: #666666; --rule: #444444; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .n1{animation-delay:.2s}.n2{animation-delay:.4s}.n3{animation-delay:.6s}.n4{animation-delay:.8s}
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 68px 40px; }
    @keyframes ping { 0%{transform:scale(.4);opacity:.9} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) { .rise,.ping { animation: none; } .rise{opacity:1} .ping{opacity:0} }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">AT A GLANCE — REAL NUMBERS ONLY</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 02</text>

  <line x1="273" y1="64" x2="273" y2="220" stroke="var(--rule)" opacity=".4"/>
  <line x1="500" y1="64" x2="500" y2="220" stroke="var(--rule)" opacity=".4"/>
  <line x1="727" y1="64" x2="727" y2="220" stroke="var(--rule)" opacity=".4"/>

  <g class="rise n1"><text fill="var(--bone)" class="mono" x="48" y="140" font-size="44">650+</text><text fill="var(--muted)" class="mono" x="48" y="164" font-size="10" letter-spacing="2">PROBLEMS SOLVED</text><text fill="var(--muted)" class="mono" x="48" y="182" font-size="10" letter-spacing="2">CODEFORCES PUPIL</text></g>

  <g class="rise n2"><text fill="var(--bone)" class="mono" x="298" y="140" font-size="44">60+</text><text fill="var(--muted)" class="mono" x="298" y="164" font-size="10" letter-spacing="2">SCANNER SUBSCRIBERS</text><text fill="var(--muted)" class="mono" x="298" y="182" font-size="10" letter-spacing="2">ORGANIC, NO MARKETING</text></g>

  <g class="rise n3"><text fill="var(--bone)" class="mono" x="525" y="140" font-size="44">8 / 122</text><text fill="var(--muted)" class="mono" x="525" y="164" font-size="10" letter-spacing="2">HACKATHON PLACEMENT</text><text fill="var(--muted)" class="mono" x="525" y="182" font-size="10" letter-spacing="2">GDG DELTA — FORWARD AI</text></g>

  <g class="rise n4"><text fill="var(--accent)" class="mono" x="752" y="140" font-size="44">3</text><text fill="var(--muted)" class="mono" x="752" y="164" font-size="10" letter-spacing="2">PRODUCTS SHIPPED</text><text fill="var(--muted)" class="mono" x="752" y="182" font-size="10" letter-spacing="2">MOBILE · AUTOMATION · OPEN SOURCE</text></g>
</svg>
